<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your parcel is on its way</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background-color:#ffffff;font-family:Helvetica,Arial,sans-serif;color:#222222;font-size:15px;line-height:1.6;">
          <tr>
            <td style="padding:32px 32px 8px;">
              <a href="{shop_url}" style="text-decoration:none;"><img src="{shop_logo}" alt="{shop_name}" style="border:0;max-width:200px;height:auto;"></a>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px 32px;">
              <p style="margin:0 0 16px;font-size:22px;">Your parcel is on its way</p>
              <p style="margin:0 0 16px;">Hello {firstname},</p>
              <p style="margin:0 0 16px;">A parcel of your order <strong>{order_name}</strong> has just left. It contains:</p>
              {products_html}
              <p style="margin:16px 0 0;">Carrier: {carrier_name}<br>Tracking number: {tracking_link_html}</p>
              <p style="margin:24px 0 0;">You can follow each parcel in your account, under "Order history and details".</p>
              <p style="margin:24px 0 0;">See you soon,<br>{shop_name}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>

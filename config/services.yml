# Loaded by every PrestaShop kernel (back office, Admin API) for the active module
services:
  _defaults:
    public: false
    autowire: true
    autoconfigure: true

  # Infrastructure
  DrSoftFr\Module\HubAsYou\Infrastructure\Persistence\ShipmentRepository: ~
  DrSoftFr\Module\HubAsYou\Infrastructure\Persistence\OrderRepository: ~
  DrSoftFr\Module\HubAsYou\Infrastructure\Persistence\OrderMailRepository: ~
  DrSoftFr\Module\HubAsYou\Infrastructure\Mail\ShipmentMailer: ~
  DrSoftFr\Module\HubAsYou\Infrastructure\Order\OrderStateWriter: ~
  DrSoftFr\Module\HubAsYou\Infrastructure\Lock\OrderLock: ~
  DrSoftFr\Module\HubAsYou\Infrastructure\Lock\ShipmentLock: ~
  DrSoftFr\Module\HubAsYou\Infrastructure\Log\ShipmentJournal: ~

  # Admin API: must run before the error listener of API Platform (priority -96)
  DrSoftFr\Module\HubAsYou\ApiPlatform\EventListener\ShipmentErrorListener:
    tags:
      - { name: kernel.event_listener, event: kernel.exception, method: onKernelException, priority: -90 }

  # Application
  DrSoftFr\Module\HubAsYou\Application\Service\OrderStatePolicy: ~
  DrSoftFr\Module\HubAsYou\Application\Service\ShipmentEffects: ~

  # CQRS handlers: registered on the command / query bus by #[AsCommandHandler] / #[AsQueryHandler]
  DrSoftFr\Module\HubAsYou\Application\CommandHandler\AddShipmentHandler: ~
  DrSoftFr\Module\HubAsYou\Application\CommandHandler\EditShipmentHandler: ~
  DrSoftFr\Module\HubAsYou\Application\CommandHandler\DeleteShipmentHandler: ~
  DrSoftFr\Module\HubAsYou\Application\CommandHandler\SendDeliveredMailHandler: ~
  DrSoftFr\Module\HubAsYou\Application\CommandHandler\SendShipmentMailHandler: ~
  DrSoftFr\Module\HubAsYou\Application\QueryHandler\GetShipmentForEditingHandler: ~
  DrSoftFr\Module\HubAsYou\Application\QueryHandler\ListShipmentsHandler: ~
